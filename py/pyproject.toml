[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abstraction-resource-protocol"
version = "0.0.0"
description = "Generated OpenAbstractions resource table and lease protocol types and service clients"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["abstraction.resource*"]
namespaces = true
